# GoReleaser configuration.
#
# No CGO is involved anywhere, so every target is a plain cross-compile.

version: 2

project_name: plex-sync

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: plex-sync
    main: .
    binary: plex-sync
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/TheIntroDB/plex-sync/internal/buildinfo.Version={{.Version}}
      - -X github.com/TheIntroDB/plex-sync/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/TheIntroDB/plex-sync/internal/buildinfo.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - '7'
    ignore:
      # Windows on ARM is built as arm64; 32-bit Windows ARM is not a target.
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm64
      - goos: darwin
        goarch: arm

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - unraid/*.xml

checksum:
  name_template: checksums.txt

# The container image, published to the GitHub Container Registry on every
# release. Only the linux binaries are used; the image is a multi-arch manifest
# for amd64 and arm64, which covers Plex servers on x86 and Apple Silicon/ARM
# NAS hosts. The version tag plus `latest` keep the README's `:latest` working
# while still pinning the exact release.
dockers_v2:
  - images:
      - ghcr.io/theintrodb/plex-sync
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Plex intro and credits markers from TheIntroDB"
      "org.opencontainers.image.url": "https://github.com/TheIntroDB/plex-sync"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.licenses": "GPL-3.0-only"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  draft: true
  footer: |-
    ## Installing

    Homebrew, on macOS or Linux:

    ```bash
    brew tap Pasithea0/tap
    brew trust --formula pasithea0/tap/plex-sync   # one-time, third-party tap
    brew install plex-sync
    ```

    Or take the archive for your platform:

    ```bash
    tar xzf plex-sync_{{ .Version }}_<os>_<arch>.tar.gz
    shasum -a 256 -c checksums.txt        # or sha256sum on Linux
    sudo install -m 755 plex-sync /usr/local/bin/
    ```

    Targets: `linux_amd64` `linux_arm64` `linux_arm` (32-bit Raspberry Pi)
    `darwin_amd64` `darwin_arm64` `windows_amd64` `windows_arm64`
    `freebsd_amd64` `freebsd_arm`.

    ## macOS

    These binaries are not signed or notarised. If you downloaded one through a
    browser, macOS quarantines it and Gatekeeper kills it on launch: no output,
    exit code 137, which looks like a crash for no reason. Clear the flag once:

    ```bash
    xattr -d com.apple.quarantine $(which plex-sync)
    ```

    `curl` does not set the flag. `plex-sync version` printing a version, rather
    than exiting 137, means it is fine.

    ## Container image

    ```bash
    docker run --rm -it \
      -e PLEX_URL=http://plex:32400 \
      -e PLEX_TOKEN=... \
      -v "/path/to/Plex Media Server:/plex:ro" \
      -v /path/to/state:/state \
      ghcr.io/theintrodb/plex-sync:{{ .Tag }} tui
    ```

    `latest` is also published, pinned to this version:
    `ghcr.io/theintrodb/plex-sync:latest`.
