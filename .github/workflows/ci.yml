name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Verify the module files are tidy
        shell: bash
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy; run 'go mod tidy' and commit the result"
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      # The release artifacts are cross-compiled, so a platform that only ever
      # builds on its own host is not enough. No CGO anywhere, which is what
      # makes this possible.
      - name: Cross-compile every release target
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            linux/amd64 linux/arm64 linux/arm \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64 \
            freebsd/amd64
          do
            GOOS="${target%%/*}" GOARCH="${target##*/}" CGO_ENABLED=0 \
              go build -trimpath -o /dev/null .
            echo "ok $target"
          done
