name: Release

# Tagging is the release. Push a tag and this builds every target, checksums the
# archives and opens a draft release with the changelog goreleaser derives from
# the commits since the last tag.
#
#   git tag -a v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0
#
# The release is a draft, so nothing is public until it is published by hand.
#
# To rehearse the whole thing without publishing anything, run this workflow
# manually with "snapshot" ticked: it builds and checksums the same artifacts
# and uploads them as a workflow artifact instead of creating a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      snapshot:
        description: Build the artifacts without creating a release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # The tests run on every platform the release ships, before anything is built.
  #
  # CI only runs on branch pushes, so a tag can point at a commit that never went
  # through it, and a test that fails only on Windows or only on Linux would
  # otherwise be discovered after the release existed. That is not hypothetical:
  # a discovery test passed on macOS and failed on the other two, and a release
  # built from that commit would have published a broken Windows binary.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Test
        run: go test -race -count=1 ./...

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      # The full history is needed: goreleaser works out the changelog from the
      # commits since the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Verify the module files are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy; run 'go mod tidy' and commit the result"
            exit 1
          fi

      - name: Check the release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Build and publish
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The rehearsal. Runs on a manual trigger, and on any tag with a suffix
      # that marks it as not-for-release, so a mistyped tag cannot publish.
      - name: Build without publishing
        if: github.event_name != 'push' || inputs.snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --snapshot --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the artifacts
        if: github.event_name != 'push' || inputs.snapshot
        uses: actions/upload-artifact@v4
        with:
          name: plex-sync-snapshot
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Update the Homebrew formula in the tap
        # After the release exists, so the URLs it writes point at something
        # real. Skipped when the token is not set, with a line saying so: a
        # missing secret must not hold up a release, and the formula already in
        # the tap keeps working at its own version.
        if: github.event_name == 'push' && inputs.snapshot != true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so the tap formula is unchanged."
            echo "brew install keeps working, at the version the tap already has."
            exit 0
          fi
          python3 scripts/update-homebrew-formula.py "${GITHUB_REF_NAME#v}" \
            --checksums dist/checksums.txt
          echo "Tap formula updated. Check it with: brew info pasithea0/tap/plex-sync"

      - name: Summarise
        run: |
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -1 dist/ 2>/dev/null | sed 's/^/  /' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/checksums.txt ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Checksums written to dist/checksums.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
